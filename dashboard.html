<!doctype html>
<meta charset="utf-8">
<title>Shadow — live compliance supervisor</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#232b36; --ink:#e6edf3; --dim:#8b949e;
    --amber:#f0a04b; --red:#ff6b6b; --green:#5ec98a; --blue:#6aa9ff; --violet:#b78bf5;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
  header{display:flex;align-items:center;gap:18px;padding:12px 18px;
         border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  h1{font-size:15px;margin:0;letter-spacing:.14em;text-transform:uppercase}
  h1 b{color:var(--amber)}
  .cid{color:var(--dim);font-size:12px}
  .counters{display:flex;gap:14px;margin-left:auto;flex-wrap:wrap}
  .counter{font-size:11px;color:var(--dim);text-align:center;min-width:64px}
  .counter b{display:block;font-size:16px;color:var(--ink)}
  .counter.hit b{color:var(--amber)}
  .counter.bad b{color:var(--red)}
  #timeline{display:flex;gap:2px;padding:8px 18px;border-bottom:1px solid var(--line);
            background:var(--panel);overflow-x:auto;min-height:30px}
  #timeline i{width:7px;height:14px;border-radius:2px;flex:0 0 auto;cursor:pointer;opacity:.85}
  main{display:grid;grid-template-columns:1fr 1fr 320px;gap:0;height:calc(100vh - 106px)}
  section{overflow-y:auto;padding:14px 16px;border-right:1px solid var(--line)}
  section h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
             margin:0 0 12px;position:sticky;top:-14px;background:var(--bg);padding:6px 0}
  .msg{margin:0 0 10px;padding:8px 11px;border-radius:9px;max-width:88%;white-space:pre-wrap;
       word-break:break-word}
  .caller{background:#1b2430;border:1px solid #26364a}
  .agent{background:#1a2620;border:1px solid #27412f;margin-left:auto}
  .who{font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;
       margin-bottom:3px}
  .ev{margin:0 0 9px;padding:8px 11px;border-radius:9px;border-left:3px solid var(--line);
      background:var(--panel);white-space:pre-wrap;word-break:break-word}
  .ev .tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;display:block;
           margin-bottom:3px}
  .instruction{border-left-color:var(--amber)} .instruction .tag{color:var(--amber)}
  .verdict-preempt{border-left-color:var(--violet)} .verdict-preempt .tag{color:var(--violet)}
  .verdict-audit{border-left-color:var(--red);background:#2a1a1d} .verdict-audit .tag{color:var(--red)}
  .task{border-left-color:var(--blue)} .task .tag{color:var(--blue)}
  .session{border-left-color:var(--dim)} .session .tag{color:var(--dim)}
  .escalation{border-left-color:var(--red);background:#3a1b1f;border:1px solid var(--red)}
  .escalation .tag{color:var(--red)}
  .ts{float:right;color:var(--dim);font-size:10px;font-weight:normal}
  #banner{display:none;padding:11px 18px;background:#4a1620;border-bottom:1px solid var(--red);
          color:#ffd9dc;letter-spacing:.05em}
  #banner.on{display:block}
  table{width:100%;border-collapse:collapse;font-size:12px}
  td,th{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--dim);font-weight:normal;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
  .sev-critical{color:var(--red)} .sev-violation{color:var(--amber)} .sev-warn{color:var(--dim)}
  .empty{color:var(--dim);font-style:italic}
  pre{margin:6px 0 0;font-size:11px;color:var(--dim);white-space:pre-wrap}
</style>

<header>
  <h1><b>Shadow</b> · compliance supervisor</h1>
  <span class="cid" id="cid">waiting for a call…</span>
  <div class="counters" id="counters"></div>
</header>
<div id="banner"></div>
<div id="timeline"></div>

<main>
  <section id="transcript"><h2>Transcript</h2><div id="tbody"></div></section>
  <section id="stream"><h2>Shadow stream</h2><div id="sbody"></div></section>
  <section id="panel"><h2>Disposition</h2><div id="pbody" class="empty">written at end of call</div></section>
</main>

<script>
const RULES = ["no_threat","third_party","recording","cease","false_urgency","identity_gate"];
const KIND_COLOR = {caller:"#26364a",agent:"#27412f",instruction:"#f0a04b",
                    verdict:"#b78bf5",escalation:"#ff6b6b",task:"#6aa9ff",session:"#8b949e"};
let seenCall = null, seenLen = 0, dispositionDone = false;

const el = (h) => { const d = document.createElement("div"); d.innerHTML = h; return d.firstElementChild; };
const esc = (s) => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const clock = (ts) => new Date(ts * 1000).toLocaleTimeString([], {hour12:false});

function reset(callId){
  seenCall = callId; seenLen = 0; dispositionDone = false;
  tbody.innerHTML = ""; sbody.innerHTML = ""; timeline.innerHTML = "";
  pbody.className = "empty"; pbody.textContent = "written at end of call";
  banner.className = ""; banner.textContent = "";
  cid.textContent = callId || "waiting for a call…";
}

function render(ev){
  // timeline tick
  const tick = el(`<i title="${esc(ev.kind)} · ${clock(ev.ts)}" style="background:${KIND_COLOR[ev.kind]||"#333"}"></i>`);
  tick.onclick = () => document.getElementById("anchor-" + ev.__i)?.scrollIntoView({behavior:"smooth",block:"center"});
  timeline.appendChild(tick);

  if (ev.kind === "caller" || ev.kind === "agent") {
    // partials of the same utterance replace in place
    const key = ev.utterance_id ? `u-${ev.kind}-${ev.utterance_id}` : null;
    const existing = key && document.getElementById(key);
    const html = `<div class="msg ${ev.kind}" ${key?`id="${key}"`:""}>
      <div class="who">${ev.kind === "caller" ? "Caller" : "Riley"}<span class="ts">${clock(ev.ts)}</span></div>
      ${esc(ev.text)}</div>`;
    if (existing) existing.outerHTML = html;
    else { const n = el(html); n.id = n.id || ("anchor-" + ev.__i); tbody.appendChild(n); }
    transcript.scrollTop = transcript.scrollHeight;
    return;
  }

  let cls = ev.kind, tag = ev.kind, body = esc(ev.text);
  if (ev.kind === "verdict") {
    cls = `verdict-${ev.meta.stage}`;
    tag = `${ev.meta.stage === "preempt" ? "BAIT DETECTED" : "VIOLATION"} · ${ev.meta.rule_id} · ${ev.meta.severity}`;
    body = `${esc(ev.text)}<pre>${esc(ev.meta.reason || "")}${ev.meta.confidence ? "  (conf " + ev.meta.confidence + ")" : ""}</pre>`;
  } else if (ev.kind === "instruction") {
    tag = `STEER${ev.meta.rule_id ? " · " + ev.meta.rule_id : ""}`;
  } else if (ev.kind === "escalation") {
    tag = "ESCALATION";
    body = `${esc(ev.meta.reason || ev.text)} → ${esc(ev.meta.destination || "supervisor")}`;
    banner.className = "on";
    banner.textContent = `ESCALATED — ${ev.meta.reason || ev.text} → ${ev.meta.destination || "supervisor"}`;
  } else if (ev.kind === "task") {
    tag = `TASK ${esc(ev.meta.event || "")} · ${esc(ev.meta.task_id || ev.text)}`;
    body = ev.meta.fields && Object.keys(ev.meta.fields).length ? `<pre>${esc(JSON.stringify(ev.meta.fields))}</pre>` : "";
  } else if (ev.kind === "session") {
    tag = "SESSION";
    body = `${esc(ev.text)}${ev.meta.termination_reason ? " · " + esc(ev.meta.termination_reason) : ""}`;
  }
  sbody.appendChild(el(`<div class="ev ${cls}" id="anchor-${ev.__i}">
      <span class="tag">${tag}<span class="ts">${clock(ev.ts)}</span></span>${body}</div>`));
  stream.scrollTop = stream.scrollHeight;
}

function counters(events){
  const tally = {};
  RULES.forEach(r => tally[r] = {p:0, v:0});
  events.filter(e => e.kind === "verdict").forEach(e => {
    const t = tally[e.meta.rule_id]; if (!t) return;
    if (e.meta.stage === "preempt") t.p++; else t.v++;
  });
  document.getElementById("counters").innerHTML = RULES.map(r => {
    const t = tally[r];
    const cls = t.v ? "bad" : t.p ? "hit" : "";
    return `<div class="counter ${cls}"><b>${t.p}/${t.v}</b>${r.replace(/_/g," ")}</div>`;
  }).join("");
}

async function disposition(url){
  if (dispositionDone || !url) return;
  const r = await fetch(url, {cache:"no-store"});
  if (!r.ok) return;
  const d = await r.json();
  dispositionDone = true;
  pbody.className = "";
  const rows = (d.violations || []).map(v => `<tr>
      <td class="sev-${esc(v.severity)}">${esc(v.rule_id)}</td>
      <td>${esc(v.reason)}<pre>${esc(v.agent_utterance)}</pre></td></tr>`).join("");
  pbody.innerHTML = `
    <table>
      <tr><th>outcome</th><td>${esc(d.termination_reason || "—")}</td></tr>
      <tr><th>verified</th><td>${d.verified ? "yes" : "no"}</td></tr>
      <tr><th>dnc</th><td>${d.dnc ? "YES" : "no"}</td></tr>
      <tr><th>steers</th><td>${(d.preempts || []).length}</td></tr>
      <tr><th>violations</th><td>${(d.violations || []).length}</td></tr>
      <tr><th>escalation</th><td>${d.escalation ? esc(d.escalation.reason) : "none"}</td></tr>
      <tr><th>duration</th><td>${d.durations_s?.total ?? "—"}s</td></tr>
    </table>
    <h2 style="margin-top:18px">Fields</h2>
    <pre>${esc(JSON.stringify(d.fields || {}, null, 1))}</pre>
    ${rows ? `<h2 style="margin-top:18px">Violations</h2><table>${rows}</table>` : ""}`;
}

async function poll(){
  try{
    const meta = await (await fetch("/latest", {cache:"no-store"})).json();
    if (!meta.call_id) return;
    if (meta.call_id !== seenCall) reset(meta.call_id);

    const text = await (await fetch(meta.events, {cache:"no-store"})).text();
    const lines = text.split("\n").filter(Boolean);
    const events = lines.map((l, i) => { try { const o = JSON.parse(l); o.__i = i; return o; } catch { return null; } }).filter(Boolean);

    for (let i = seenLen; i < events.length; i++) render(events[i]);
    if (events.length !== seenLen) counters(events);
    seenLen = events.length;

    if (events.some(e => e.kind === "session" && e.meta.event === "end")) disposition(meta.disposition);
  }catch(e){ /* server not up yet; keep polling */ }
}
setInterval(poll, 800); poll();
</script>
